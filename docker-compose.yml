services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 2s
      retries: 15

  seed:
    build: .
    command: ["order-seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@db:5432/orders
    depends_on:
      db: {condition: service_healthy}

  approvals:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@db:5432/orders
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    ports: ["8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}

volumes:
  pgdata:
