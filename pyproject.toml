[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safe-orders-mcp"
version = "0.1.0"
description = "MCP server exposing an order/inventory database to LLM agents, with human-in-the-loop approval for destructive operations"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
order-mcp = "order_mcp.mcp_server:main"
order-approvals = "order_mcp.approval_api:main"
order-seed = "order_mcp.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
